<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Upload a paper to get started">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C0E9AE" stop-opacity=".55"></stop>
      <stop offset="45%" stop-color="#10B981" stop-opacity=".18"></stop>
      <stop offset="100%" stop-color="#065F46" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity=".9"></stop>
      <stop offset="60%" stop-color="#D1FAE5" stop-opacity=".35"></stop>
      <stop offset="100%" stop-color="#065F46" stop-opacity=".05"></stop>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"></feGaussianBlur>
    </filter>
  </defs>

  
  <ellipse cx="240" cy="170" rx="220" ry="140" fill="url(#glow)"></ellipse>

  
  <g stroke="#065F46" stroke-width="1" opacity=".08">
    <line x1="90" y1="70" x2="390" y2="70"></line>
    <line x1="90" y1="92" x2="390" y2="92"></line>
    <line x1="90" y1="114" x2="390" y2="114"></line>
    <line x1="90" y1="206" x2="390" y2="206"></line>
    <line x1="90" y1="228" x2="390" y2="228"></line>
    <line x1="90" y1="250" x2="390" y2="250"></line>
  </g>

  
  <g font-family="&#39;Geist Mono&#39;, ui-monospace, monospace" fill="#065F46" opacity=".22">
    <text x="108" y="88" font-size="12">∀ε&gt;0, ∃δ&gt;0 :  |x−a| &lt; δ</text>
    <text x="108" y="240" font-size="12">⇒ |f(x)−L| &lt; ε       ∎</text>
  </g>

  
  <g transform="translate(240 160)">
    
    <circle r="92" fill="url(#lens)"></circle>
    
    <circle r="92" fill="none" stroke="#065F46" stroke-width="5" stroke-linecap="round"></circle>
    
    <circle r="54" fill="none" stroke="#065F46" stroke-width="1.5" stroke-dasharray="3 6" opacity=".55"></circle>
    
    <g stroke="#065F46" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-116" x2="0" y2="-100"></line>
      <line x1="0" y1="100" x2="0" y2="116"></line>
      <line x1="-116" y1="0" x2="-100" y2="0"></line>
      <line x1="100" y1="0" x2="116" y2="0"></line>
    </g>
    
    <g stroke="#065F46" stroke-width="1.5" stroke-linecap="round" opacity=".45">
      <line x1="0" y1="-82" x2="0" y2="-28"></line>
      <line x1="0" y1="28" x2="0" y2="82"></line>
      <line x1="-82" y1="0" x2="-28" y2="0"></line>
      <line x1="28" y1="0" x2="82" y2="0"></line>
    </g>
    
    <circle r="4" fill="#065F46"></circle>
  </g>

  
  <g filter="url(#soft)">
    <text x="240" y="165" text-anchor="middle" font-family="&#39;Geist Mono&#39;, ui-monospace, monospace" font-size="20" fill="#065F46" opacity=".92">|f(x)−L|&lt;ε</text>
  </g>

  
  <ellipse cx="206" cy="126" rx="26" ry="10" fill="#fff" opacity=".35" transform="rotate(-25 206 126)"></ellipse>
</svg>